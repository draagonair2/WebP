<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>설문지</title>
</head>

<body>

<header>
    <h1>설문지</h1>
    <p>
        소프트웨어 기술에 대한 의견을 듣습니다.
        많은 참여 부탁드립니다.
    </p>
</header>

<section>

    <form>

        <p>
            학년
            <input type="radio" name="grade" value="1">1학년
            <input type="radio" name="grade" value="2">2학년
            <input type="radio" name="grade" value="3">3학년
            <input type="radio" name="grade" value="4">4학년
        </p>

        <p>
            성별
            <input type="radio" name="gender" value="male">남
            <input type="radio" name="gender" value="female">여
        </p>

        <p>
            관심 분야
            <select>
                <option>모바일 소프트웨어</option>
                <option>웹 프로그래밍</option>
                <option>인공지능</option>
                <option>게임</option>
            </select>
        </p>

        <p>
            진로
            <input type="checkbox">개발
            <input type="checkbox">기획
            <input type="checkbox">영업
            <input type="checkbox">창업
        </p>

        <p>
            남기고 싶은 말<br>
            <textarea cols="50" rows="10"
            placeholder="글을 남겨주세요"></textarea>
        </p>

    </form>

</section>

<footer>
    <p>Copyright 2022 by Kitae</p>
</footer>

</body>
</html>
