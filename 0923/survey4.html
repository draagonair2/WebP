<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>설문지</title>
    <link href="survey4.css" type="text/css" rel="stylesheet">
</head>

<body>

<header>
    <h1>설문지</h1>
    <p>
        소프트웨어 기술에 대한 의견을 듣습니다.
        많은 참여 부탁드립니다.
    </p>
</header>

<section>

<form>

    <p>
        <span>학년</span>

        <input type="radio" name="grade" value="1" checked>1학년
        <input type="radio" name="grade" value="2">2학년
        <input type="radio" name="grade" value="3">3학년
        <input type="radio" name="grade" value="4">4학년
    </p>

    <p>
        <span>성별</span>

        <input type="radio" name="gender" value="male">남
        <input type="radio" name="gender" value="female" checked>여
    </p>

    <p>
        <span>관심 분야</span>

        <select>
            <option>모바일 소프트웨어</option>
            <option>웹 프로그래밍</option>
            <option>인공지능</option>
            <option>게임</option>
        </select>
    </p>

    <p>
        <span>진로(다중 선택)</span>

        <input type="checkbox" checked>개발
        <input type="checkbox">기획
        <input type="checkbox">영업
        <input type="checkbox">창업
    </p>

    <p>
        <span>남기고 싶은 말</span>

        <textarea cols="40" rows="8"
                  placeholder="글을 남겨주세요"></textarea>
    </p>

</form>

</section>

<footer>
    Copyright 2022 by Kitae
</footer>

</body>
</html>
