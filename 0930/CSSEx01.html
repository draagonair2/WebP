<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display 프로퍼티</title>
</head>
    <style>
        div {
            color: blue;
            background-color: aliceblue;
            border: yellowgreen;
        }
        span{
            background: yellow;
            border: 3px dotted red;
        }
    </style>
<body>
    <h3>인라인, 인라인 블록</h3>
    <hr>
    나는 <div style="display: none;">div(none)</div>입니다. <br> <br>
    나는 <div style="display: inline;">div(inline)</div>입니다. <br><br>
    나는 <div style="display: inline-block;">div(inline-block)</div>입니다. <br> <br>
    나는 <div>div <span style="display: block;">span(block)</span></div>입니다.
</body>
</html>
