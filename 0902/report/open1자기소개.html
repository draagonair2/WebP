<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <style>
        body{background-color : lavender;color: rgb(64, 0, 255);
                margin-left : 38px; margin-right : 60px;}
        h3 {text-align : center; color :darkgreen;}
        hr { height : 5px; border : solid grey;
                background-color : greenyellow;}
        span {color : white; font-size : 20px;}
    </style>
    <script>
        function show() {
            document.getElementById("won").src = "won.png";
        }
        function hide() {
            document.getElementById("won").src = "";
        }
    </script>
</head>
<body>
    <h3 onmouseover="show()" onmouseout="hide()">
        정 원 형</h3>
    <hr>
    <div><img id="won" src=""></div>
     저는 대한민국에서 태어나서 소프트웨어학과를 전공하는 학생입니다. 제가 제일 좋아하는 과목은 <span>웹 프로그래밍</span>이고, 그 중에서도 <span>자바스크립트</span>를 제일 잘합니다.
</body>
</html>
