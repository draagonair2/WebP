<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>2</title>
</head>
<body>
    <script>
        // 문자를 n번 출력하는 함수
        function pr(str, n) {
            for (let i = 0; i < n; i++) {
                document.write(str);
            }
        }
    </script>

    <script>
        pr("%", 5);
    </script>
</body>
</html>
