<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>큰 자리수와 낮은자리수 비교</title>
</head>
<body>
    <h3>큰 자리수와 낮은자리수 같은지 비교</h3>
    <hr>

    <script>
        let n = parseInt(prompt("숫자 입력", ""));
        let original = n;

        if (isNaN(n) || n < 0) {
            document.write("입력 오류");
        }
        else {
            // 맨 뒷자리 숫자 구하기
            let last = n % 10;

            // 맨 앞자리 숫자 구하기
            while (n >= 10) {
                n = Math.floor(n / 10);
            }

            // 비교
            if (n == last) {
                document.write(original + ": 같음");
            }
            else {
                document.write(original + ": 다름");
            }
        }
    </script>
</body>
</html>
