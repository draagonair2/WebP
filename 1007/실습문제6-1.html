<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>1</title>
</head>
<body>
    <script>
        // 두 수 중 큰 수를 반환하는 함수
        function big(a, b) {
            a = parseInt(a);
            b = parseInt(b);

            if (a > b) {
                return a;
            }
            else {
                return b;
            }
        }
    </script>

    <script>
        let b = big("625", "555");
        document.write("큰수=" + b);
    </script>
</body>
</html>
