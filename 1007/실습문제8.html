<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>eval()로 수식 계산</title>
</head>
<body>
    <h3>eval()로 수식 계산</h3>
    <hr>

    <script>
        let expression = prompt("수식 입력", "");

        if (expression !== null && expression !== "") {
            let result = eval(expression);

            document.write(expression + " = " + result);
        }
    </script>
</body>
</html>
