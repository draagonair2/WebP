<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>z-index 스타일 프로퍼티</title>
    <style>
        div {
            position: absolute;
        }
        img {
            position: absolute;
            left: 0;
            top: 0;
        }
    </style>
</head>
<body>
    <h3>z-index 스타일 프로퍼티</h3>
    <hr>

    <div>
        <img src="mediaspade-A.png.png" width="100" height="140" alt="스페이드A">
        <img src="mediaspade-2.png.png" width="100" height="140" alt="스페이드2">
        <img src="mediaspade-3.png.png" width="100" height="140" alt="스페이드3">
        <img src="mediaspade-7.png.png" width="100" height="140" alt="스페이드7">
    </div>

    <script>
        let cards = document.getElementsByTagName("img");
        let lowestZ = 0;

        for (let i = 0; i < cards.length; i++) {
            cards[i].style.zIndex = i;

            cards[i].onclick = function() {
                this.style.zIndex = --lowestZ;
            };
        }
    </script>
</body>
</html>
